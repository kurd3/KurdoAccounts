<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurd0o | Charcoal & Orange Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            charcoal: '#09090b',
            surface: '#121216',
            card: '#16161b',
            line: '#27272f',
            ember: '#f97316',
            emberhover: '#ea580c'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      background-image: radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.14), transparent 48%);
      color: #fafafa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .game-card {
      background: linear-gradient(180deg, #17171c 0%, #111115 100%);
      border: 1px solid #27272f;
      transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.22s ease;
    }
    .game-card:hover {
      border-color: rgba(249, 115, 22, 0.55);
      box-shadow: 0 16px 36px -14px rgba(249, 115, 22, 0.25);
    }
    .game-card:active {
      transform: scale(0.985);
    }
    .req-btn {
      transition: transform 0.14s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }
    .req-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-orange-500 selection:text-black">

  <!-- Top Bar -->
  <header class="sticky top-0 z-20 bg-[#09090b]/90 backdrop-blur-md border-b border-[#27272f] px-4 py-3.5">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-orange-500 text-black font-black flex items-center justify-center text-base shadow-md shadow-orange-500/25">
          K
        </div>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg tracking-tight leading-none">KURD0O STORE</h1>
          <p class="text-[11px] text-orange-400/90 font-medium mt-1">INSTANT TELEGRAM REQUEST</p>
        </div>
      </div>

      <a
        href="https://t.me/yousifmziri"
        target="_blank"
        rel="noopener noreferrer"
        class="req-btn px-3.5 py-1.5 rounded-lg bg-[#16161b] hover:bg-[#1f1f27] border border-orange-500/40 text-orange-400 text-xs font-bold tracking-wide"
      >
        @yousifmziri
      </a>
    </div>
  </header>

  <!-- Games Grid -->
  <main class="max-w-4xl mx-auto px-4 pt-6">
    <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
  </main>

  <script>
    const TELEGRAM_USER = 'yousifmziri';

    const games = [
      {
        id: 'minecraft',
        title: 'Minecraft',
        price: 1.00,
        images: [
          'https://images.launchbox-app.com/e6b4f4e4-63d2-4d3d-98f6-5669a3c42b13.jpg',
          'https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png'
        ],
        fallback: 'MINECRAFT'
      },
      {
        id: 'tomb-raider',
        title: 'Tomb Raider',
        price: 4.00,
        images: [
          'https://images.launchbox-app.com/72894a8b-0a7b-4f9e-8b5a-31f92c2d9a11.jpg',
          'https://upload.wikimedia.org/wikipedia/en/0/0a/Tomb_Raider_%282013_video_game%29.jpg'
        ],
        fallback: 'TOMB RAIDER'
      },
      {
        id: 'rdr',
        title: 'Red Dead Redemption',
        price: 5.00,
        images: [
          'https://upload.wikimedia.org/wikipedia/en/a/a7/Red_Dead_Redemption.jpg',
          'https://images.launchbox-app.com/19336877-2d8a-4d27-9a4e-8f7a9d3c6b12.jpg'
        ],
        fallback: 'RED DEAD REDEMPTION'
      },
      {
        id: 'gta-sa-de',
        title: 'GTA: San Andreas – Definitive Edition',
        price: 4.00,
        images: [
          'https://upload.wikimedia.org/wikipedia/en/c/c4/GTASABOX.jpg',
          'https://images.launchbox-app.com/6a9c8f2e-3b1d-4e7a-9c5b-2d4f6a8e1b3c.jpg'
        ],
        fallback: 'GTA SAN ANDREAS DE'
      }
    ];

    function handleCoverError(imgEl, gameId, nextIndex) {
      const game = games.find(g => g.id === gameId);
      if (game && game.images && nextIndex < game.images.length) {
        imgEl.setAttribute('onerror', `handleCoverError(this, '${gameId}', ${nextIndex + 1})`);
        imgEl.src = game.images[nextIndex];
      } else {
        const label = game ? game.fallback : 'GAME';
        imgEl.outerHTML = `<div class="w-full h-full bg-[#1b1b22] flex items-center justify-center text-orange-400 font-extrabold text-sm tracking-wider px-4 text-center">${label}</div>`;
      }
    }

    function buildRequestUrl(game) {
      const message = `Hello @${TELEGRAM_USER}, I want to REQUEST: ${game.title} ($${game.price.toFixed(2)})`;
      return `https://t.me/${TELEGRAM_USER}?text=${encodeURIComponent(message)}`;
    }

    function renderGames() {
      const grid = document.getElementById('games-grid');
      grid.innerHTML = games.map(game => {
        const tgLink = buildRequestUrl(game);
        return `
          <article class="game-card rounded-2xl overflow-hidden flex flex-col">
            <div class="relative w-full h-60 sm:h-64 bg-[#101014] overflow-hidden border-b border-[#27272f]">
              <img
                src="${game.images[0]}"
                alt="${game.title}"
                class="w-full h-full object-cover transition duration-300 hover:scale-105"
                onerror="handleCoverError(this, '${game.id}', 1)"
              />
              <span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-black/80 backdrop-blur border border-orange-500/50 text-orange-400 font-extrabold text-sm">
                $${game.price.toFixed(2)}
              </span>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between gap-4">
              <h2 class="font-bold text-base sm:text-lg text-white leading-snug">
                ${game.title}
              </h2>

              <a
                href="${tgLink}"
                target="_blank"
                rel="noopener noreferrer"
                class="req-btn w-full py-3 px-4 rounded-xl bg-orange-500 hover:bg-orange-600 text-black font-extrabold text-sm tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20"
              >
                <span>REQUEST</span>
                <span>$${game.price.toFixed(2)}</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    renderGames();
  </script>
</body>
</html>
