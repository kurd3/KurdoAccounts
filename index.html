<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurd0o Store | Game Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgmain: '#0b0912',
            cardbg: '#161224',
            cardborder: '#261f3d',
            accent: '#7c3aed',
            accenthover: '#6d28d9'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0912;
      color: #f4f3f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-[#0b0912]/90 backdrop-blur border-b border-[#261f3d] px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center font-bold text-white shadow-lg shadow-violet-900/40">
          K
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">Kurd0o Store</h1>
          <p class="text-[11px] text-zinc-400">Digital Game Accounts</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="https://t.me/yousifmziri" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 bg-[#161224] hover:bg-[#1e1830] border border-[#261f3d] px-3 py-1.5 rounded-full text-xs font-semibold text-violet-300 transition">
          <span>@yousifmziri</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app-content" class="max-w-xl mx-auto px-4 pt-4 space-y-3"></main>

  <!-- Cart Drawer / Modal -->
  <div id="cart-modal" class="fixed inset-0 z-40 hidden bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="w-full max-w-md bg-[#161224] border border-[#261f3d] rounded-t-3xl sm:rounded-2xl p-5 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-[#261f3d]">
        <div>
          <h2 class="font-bold text-lg">Shopping Cart</h2>
          <p class="text-[11px] text-zinc-400">Direct Telegram: <span class="text-violet-300 font-semibold">@yousifmziri</span></p>
        </div>
        <button onclick="closeCartModal()" class="text-zinc-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <div id="cart-items" class="py-4 space-y-3 overflow-y-auto flex-1"></div>

      <div class="pt-3 border-t border-[#261f3d] space-y-3">
        <div class="flex items-center justify-between text-sm">
          <span class="text-zinc-400">Total</span>
          <span id="cart-total" class="font-bold text-lg text-violet-300">$0.00</span>
        </div>

        <a id="telegram-order-btn" href="https://t.me/yousifmziri" target="_blank" rel="noopener noreferrer" onclick="saveOrderOnTelegramClick()" class="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-700 font-semibold text-sm text-white transition flex items-center justify-center gap-2">
          <span>Order on Telegram (@yousifmziri)</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-violet-600 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg"></div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 z-30 bg-[#120e1e]/95 backdrop-blur border-t border-[#261f3d]">
    <div class="max-w-xl mx-auto grid grid-cols-4 py-2 text-[11px]">
      <button onclick="setTab('catalog')" id="nav-catalog" class="flex flex-col items-center gap-1 py-1 text-violet-400 font-semibold">
        <span>Catalog</span>
      </button>
      <button onclick="setTab('cart')" id="nav-cart" class="relative flex flex-col items-center gap-1 py-1 text-zinc-400 hover:text-zinc-200">
        <span>Cart</span>
        <span id="cart-badge" class="hidden absolute top-0.5 right-6 bg-violet-600 text-white text-[10px] font-bold px-1.5 rounded-full">0</span>
      </button>
      <button onclick="setTab('orders')" id="nav-orders" class="flex flex-col items-center gap-1 py-1 text-zinc-400 hover:text-zinc-200">
        <span>Orders</span>
      </button>
      <button onclick="setTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 py-1 text-zinc-400 hover:text-zinc-200">
        <span>Profile</span>
      </button>
    </div>
  </nav>

  <script>
    const TELEGRAM_USER = 'yousifmziri';

    const games = [
      {
        id: 'mc',
        title: 'Minecraft',
        rating: '5.0',
        reviews: 60,
        sold: 3842,
        price: 1.00,
        hot: true,
        image: 'https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png',
        fallbackEmoji: '⛏️',
        desc: 'Full game access with instant delivery.'
      },
      {
        id: 'tr',
        title: 'Tomb Raider',
        rating: '4.9',
        reviews: 24,
        sold: 518,
        price: 4.00,
        hot: true,
        image: 'https://upload.wikimedia.org/wikipedia/en/0/0a/Tomb_Raider_%282013_video_game%29.jpg',
        fallbackEmoji: '🏹',
        desc: 'Action-adventure story campaign ready.'
      },
      {
        id: 'rdr',
        title: 'Red Dead Redemption',
        rating: '4.9',
        reviews: 19,
        sold: 429,
        price: 5.00,
        hot: true,
        image: 'https://upload.wikimedia.org/wikipedia/en/a/a7/Red_Dead_Redemption.jpg',
        fallbackEmoji: '🤠',
        desc: 'Classic open-world western experience.'
      },
      {
        id: 'gtasa-de',
        title: 'GTA: San Andreas – Definitive Edition',
        rating: '4.8',
        reviews: 31,
        sold: 890,
        price: 4.00,
        hot: false,
        image: 'https://upload.wikimedia.org/wikipedia/en/c/c4/GTASABOX.jpg',
        fallbackEmoji: '🌴',
        desc: 'Remastered edition with updated visuals.'
      }
    ];

    let state = {
      tab: 'catalog',
      cart: [],
      orders: []
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.add('hidden'), 2000);
    }

    function updateTelegramLink() {
      const btn = document.getElementById('telegram-order-btn');
      const total = getCartTotal().toFixed(2);
      if (state.cart.length === 0) {
        btn.href = `https://t.me/${TELEGRAM_USER}`;
        return;
      }
      const lines = state.cart.map(item => `- ${item.title} (x${item.qty}) = $${(item.price * item.qty).toFixed(2)}`);
      const text = `Hello @${TELEGRAM_USER}, I want to order:\n${lines.join('\n')}\nTotal: $${total}`;
      btn.href = `https://t.me/${TELEGRAM_USER}?text=${encodeURIComponent(text)}`;
    }

    function updateBadge() {
      const totalQty = state.cart.reduce((sum, item) => sum + item.qty, 0);
      const badge = document.getElementById('cart-badge');
      if (totalQty > 0) {
        badge.textContent = totalQty;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
      updateTelegramLink();
    }

    function addToCart(gameId) {
      const game = games.find(g => g.id === gameId);
      if (!game) return;
      const existing = state.cart.find(item => item.id === gameId);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ ...game, qty: 1 });
      }
      updateBadge();
      showToast(`Added ${game.title} to cart`);
      if (state.tab === 'cart') render();
    }

    function changeQty(gameId, delta) {
      const idx = state.cart.findIndex(item => item.id === gameId);
      if (idx === -1) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) {
        state.cart.splice(idx, 1);
      }
      updateBadge();
      renderCartModal();
      if (state.tab === 'cart') render();
    }

    function getCartTotal() {
      return state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    }

    function openCartModal() {
      renderCartModal();
      updateTelegramLink();
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function renderCartModal() {
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      totalEl.textContent = `$${getCartTotal().toFixed(2)}`;

      if (state.cart.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 space-y-3">
            <p class="text-zinc-400 text-sm">Your cart is empty.</p>
            <a href="https://t.me/${TELEGRAM_USER}" target="_blank" rel="noopener noreferrer" class="inline-block px-4 py-2 rounded-xl bg-[#241d3d] hover:bg-[#2e254f] text-xs font-semibold text-violet-300">
              Message @${TELEGRAM_USER} on Telegram
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = state.cart.map(item => `
        <div class="flex items-center justify-between gap-3 bg-[#1c172e] border border-[#2b2347] rounded-xl p-3">
          <img src="${item.image}" alt="${item.title}" class="w-11 h-11 rounded-lg object-cover shrink-0 bg-[#120e1e]" onerror="this.style.display='none'" />
          <div class="min-w-0 flex-1">
            <p class="font-semibold text-sm truncate">${item.title}</p>
            <p class="text-xs text-zinc-400">$${(item.price * item.qty).toFixed(2)}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-[#2a2244] font-bold">-</button>
            <span class="text-xs font-semibold w-4 text-center">${item.qty}</span>
            <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-violet-600 font-bold">+</button>
          </div>
        </div>
      `).join('');
    }

    function saveOrderOnTelegramClick() {
      if (state.cart.length === 0) return;
      const total = getCartTotal();
      state.orders.unshift({
        id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
        items: state.cart.map(i => `${i.title} (x${i.qty})`).join(', '),
        total: total,
        status: 'Sent to @' + TELEGRAM_USER
      });
      state.cart = [];
      updateBadge();
      closeCartModal();
      setTab('orders');
    }

    function setTab(tabName) {
      state.tab = tabName;
      ['catalog', 'cart', 'orders', 'profile'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (t === tabName) {
          el.classList.remove('text-zinc-400');
          el.classList.add('text-violet-400', 'font-semibold');
        } else {
          el.classList.add('text-zinc-400');
          el.classList.remove('text-violet-400', 'font-semibold');
        }
      });

      if (tabName === 'cart') {
        openCartModal();
      }
      render();
    }

    function renderCatalog() {
      return games.map(game => `
        <div class="flex items-center justify-between gap-3 bg-[#161224] hover:bg-[#1a152b] border border-[#261f3d] rounded-2xl p-3.5 transition">
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="relative shrink-0">
              <img
                src="${game.image}"
                alt="${game.title}"
                class="w-14 h-14 rounded-2xl object-cover shadow-md border border-[#2b2347] bg-[#120e1e]"
                onerror="this.outerHTML='<div class=\\'w-14 h-14 rounded-2xl bg-violet-900/50 flex items-center justify-center text-2xl\\'>${game.fallbackEmoji}</div>'"
              />
              ${game.hot ? `<span class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-orange-500 text-[11px] flex items-center justify-center shadow">🔥</span>` : ''}
            </div>
            <div class="min-w-0">
              <h2 class="font-bold text-sm sm:text-base truncate">${game.title}</h2>
              <div class="flex items-center gap-2 text-xs text-zinc-400 mt-0.5">
                <span class="text-amber-400 font-semibold">★ ${game.rating}</span>
                <span>(${game.reviews})</span>
                <span>•</span>
                <span>${game.sold} sold</span>
              </div>
              <p class="text-[11px] text-zinc-500 truncate mt-0.5">${game.desc}</p>
            </div>
          </div>

          <div class="flex items-center gap-2.5 shrink-0">
            <span class="font-bold text-sm sm:text-base text-white">$${game.price.toFixed(2)}</span>
            <button onclick="addToCart('${game.id}')" aria-label="Add ${game.title} to cart" class="w-10 h-10 rounded-xl bg-violet-600 hover:bg-violet-700 active:scale-95 flex items-center justify-center text-white transition shadow-md shadow-violet-950/60">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderOrders() {
      if (state.orders.length === 0) {
        return `
          <div class="bg-[#161224] border border-[#261f3d] rounded-2xl p-8 text-center space-y-2">
            <p class="font-semibold text-sm">No orders yet</p>
            <p class="text-xs text-zinc-400">Add a game to the cart and message @${TELEGRAM_USER} on Telegram to order.</p>
          </div>
        `;
      }
      return state.orders.map(order => `
        <div class="bg-[#161224] border border-[#261f3d] rounded-2xl p-4 space-y-1.5">
          <div class="flex items-center justify-between text-xs">
            <span class="font-bold text-violet-300">${order.id}</span>
            <span class="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-semibold">${order.status}</span>
          </div>
          <p class="text-sm font-medium">${order.items}</p>
          <p class="text-xs text-zinc-400">Total: $${order.total.toFixed(2)}</p>
        </div>
      `).join('');
    }

    function renderProfile() {
      return `
        <div class="bg-[#161224] border border-[#261f3d] rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="font-bold text-base">Kurd0o Store</h2>
              <p class="text-xs text-zinc-400">Direct Telegram Support: @${TELEGRAM_USER}</p>
            </div>
            <a href="https://t.me/${TELEGRAM_USER}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-xs font-semibold">
              Open Telegram
            </a>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-2 border-t border-[#261f3d] text-xs">
            <div class="bg-[#110d1c] rounded-xl p-3">
              <p class="text-zinc-400">Contact Handle</p>
              <p class="font-bold text-sm text-violet-300 mt-1">@${TELEGRAM_USER}</p>
            </div>
            <div class="bg-[#110d1c] rounded-xl p-3">
              <p class="text-zinc-400">Logged Orders</p>
              <p class="font-bold text-sm text-white mt-1">${state.orders.length}</p>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app-content');
      if (state.tab === 'catalog' || state.tab === 'cart') {
        app.innerHTML = renderCatalog();
      } else if (state.tab === 'orders') {
        app.innerHTML = renderOrders();
      } else if (state.tab === 'profile') {
        app.innerHTML = renderProfile();
      }
    }

    updateBadge();
    render();
  </script>
</body>
</html>
