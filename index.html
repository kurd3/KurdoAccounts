<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurd0o | Charcoal & Orange Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            charcoal: '#09090b',
            surface: '#121216',
            card: '#16161b',
            line: '#27272f',
            ember: '#f97316',
            emberhover: '#ea580c'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      background-image: radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.14), transparent 48%);
      color: #fafafa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .game-card {
      background: linear-gradient(180deg, #17171c 0%, #111115 100%);
      border: 1px solid #27272f;
      transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.22s ease;
    }
    .game-card:hover {
      border-color: rgba(249, 115, 22, 0.55);
      box-shadow: 0 16px 36px -14px rgba(249, 115, 22, 0.25);
    }
    .game-card:active {
      transform: scale(0.985);
    }
    .req-btn {
      transition: transform 0.14s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }
    .req-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-orange-500 selection:text-black">

  <!-- Top Bar -->
  <header class="sticky top-0 z-20 bg-[#09090b]/90 backdrop-blur-md border-b border-[#27272f] px-4 py-3.5">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-orange-500 text-black font-black flex items-center justify-center text-base shadow-md shadow-orange-500/25">
          K
        </div>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg tracking-tight leading-none">KURD0O STORE</h1>
          <p class="text-[11px] text-orange-400/90 font-medium mt-1">INSTANT TELEGRAM REQUEST</p>
        </div>
      </div>

      <a
        href="https://t.me/yousifmziri"
        target="_blank"
        rel="noopener noreferrer"
        class="req-btn px-3.5 py-1.5 rounded-lg bg-[#16161b] hover:bg-[#1f1f27] border border-orange-500/40 text-orange-400 text-xs font-bold tracking-wide"
      >
        @yousifmziri
      </a>
    </div>
  </header>

  <!-- Games Grid -->
  <main class="max-w-4xl mx-auto px-4 pt-6">
    <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
  </main>

  <script>
    const TELEGRAM_USER = 'yousifmziri';

    function makeSvgBanner(title, subtitle, c1, c2) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${c1}"/>
            <stop offset="100%" stop-color="${c2}"/>
          </linearGradient>
        </defs>
        <rect width="800" height="450" fill="url(#g)"/>
        <circle cx="680" cy="90" r="160" fill="rgba(255,255,255,0.08)"/>
        <circle cx="120" cy="380" r="140" fill="rgba(0,0,0,0.22)"/>
        <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="2">${title}</text>
        <text x="50%" y="61%" dominant-baseline="middle" text-anchor="middle" fill="rgba(255,255,255,0.82)" font-family="system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="4">${subtitle}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    const games = [
      {
        id: 'minecraft',
        title: 'Minecraft',
        price: 1.00,
        images: [
          'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1672970/header.jpg',
          'https://image.api.playstation.com/vulcan/img/rnd/202010/2621/H9v5o8vP6RKkQtRbuKCZWsyE.png',
          makeSvgBanner('MINECRAFT', 'JAVA & BEDROCK EDITION', '#15803d', '#052e16')
        ]
      },
      {
        id: 'tomb-raider',
        title: 'Tomb Raider',
        price: 4.00,
        images: [
          'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/203160/header.jpg',
          'https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/203160/header.jpg',
          makeSvgBanner('TOMB RAIDER', 'SURVIVOR EDITION', '#c2410c', '#1c1917')
        ]
      },
      {
        id: 'rdr',
        title: 'Red Dead Redemption',
        price: 5.00,
        images: [
          'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2668510/header.jpg',
          'https://upload.wikimedia.org/wikipedia/en/a/a7/Red_Dead_Redemption.jpg',
          makeSvgBanner('RED DEAD REDEMPTION', 'ROCKSTAR GAMES', '#b91c1c', '#18181b')
        ]
      },
      {
        id: 'gta-sa-de',
        title: 'GTA: San Andreas – Definitive Edition',
        price: 4.00,
        images: [
          'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1547000/header.jpg',
          'https://upload.wikimedia.org/wikipedia/en/c/c4/GTASABOX.jpg',
          makeSvgBanner('GTA: SAN ANDREAS', 'THE DEFINITIVE EDITION', '#d97706', '#18181b')
        ]
      }
    ];

    function handleCoverError(imgEl, gameId, nextIndex) {
      const game = games.find(g => g.id === gameId);
      if (game && game.images && nextIndex < game.images.length) {
        imgEl.setAttribute('onerror', `handleCoverError(this, '${gameId}', ${nextIndex + 1})`);
        imgEl.src = game.images[nextIndex];
      }
    }

    function buildRequestUrl(game) {
      const message = `Hello @${TELEGRAM_USER}, I want to REQUEST: ${game.title} ($${game.price.toFixed(2)})`;
      return `https://t.me/${TELEGRAM_USER}?text=${encodeURIComponent(message)}`;
    }

    function renderGames() {
      const grid = document.getElementById('games-grid');
      grid.innerHTML = games.map(game => {
        const tgLink = buildRequestUrl(game);
        return `
          <article class="game-card rounded-2xl overflow-hidden flex flex-col">
            <div class="relative w-full aspect-[16/9] bg-[#101014] overflow-hidden border-b border-[#27272f]">
              <img
                src="${game.images[0]}"
                alt="${game.title}"
                class="w-full h-full object-cover transition duration-300 hover:scale-105"
                onerror="handleCoverError(this, '${game.id}', 1)"
              />
              <span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-black/85 backdrop-blur border border-orange-500/60 text-orange-400 font-extrabold text-sm shadow-md">
                $${game.price.toFixed(2)}
              </span>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between gap-4">
              <h2 class="font-bold text-base sm:text-lg text-white leading-snug">
                ${game.title}
              </h2>

              <a
                href="${tgLink}"
                target="_blank"
                rel="noopener noreferrer"
                class="req-btn w-full py-3 px-4 rounded-xl bg-orange-500 hover:bg-orange-600 text-black font-extrabold text-sm tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20"
              >
                <span>REQUEST</span>
                <span>$${game.price.toFixed(2)}</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    renderGames();
  </script>
</body>
</html>
